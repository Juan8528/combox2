<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>SB Admin 2 - Registro</title>

    <!-- Custom fonts for this template-->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

<div class="container">
<div class="card o-hidden border-0 shadow-lg my-5">
    <div class="card-body p-0">
    <!-- Nested Row within Card Body -->
  <div class="row">
<div class="col-lg-5 d-none d-lg-block bg-register-image"></div>
    <div class="col-lg-7">
    <div class="p-5">
    <div class="text-center">
     <h1 class="h4 text-gray-900 mb-4">¡Crea una cuenta!</h1>
    </div>
    <form class="user" id="signupForm">
    <div class="form-group row">
    <div class="col-sm-6 mb-3 mb-sm-0">
    <input type="text" class="form-control form-control-user" id="nombre"placeholder="Nombre" required>
</div>
    <div class="col-sm-6">
<input type="text" class="form-control form-control-user" id="apellido"placeholder="Apellido">
</div>
</div>
    <div class="form-group">
<input type="email" class="form-control form-control-user" id="email"placeholder="Correo electrónico" required>
</div>
<div class="form-group row">
 <div class="col-sm-6 mb-3 mb-sm-0">
<input type="password" class="form-control form-control-user"
id="password" placeholder="Contraseña" minlength="6" required>
</div>
    <div class="col-sm-6">
<input type="password" class="form-control form-control-user"
 id="password2" placeholder="Repetir contraseña" minlength="6" required>
</div>
</div>
<button type="submit" class="btn btn-primary btn-user btn-block">
    Registrar cuenta
 </button>
<div id="mensaje" class="mt-3"></div>
</form>
<hr>
<div class="text-center">
<a class="small" href="forgot-password.html">¿Olvidaste tu contraseña?</a>
</div>
<div class="text-center">
<a class="small" href="login.html">¿Ya tienes una cuenta? Inicia sesión</a>
 </div>
</div>
</div>
</div>
</div>
</div>
</div>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <script src="js/sb-admin-2.min.js"></script>

    <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('mensaje');
        const password = document.getElementById('password').value;

        if (password !== document.getElementById('password2').value) {
            msg.className = 'mt-3 alert alert-danger';
            msg.textContent = 'Las contraseñas no coinciden';
            return;
        }

        const body = {
            nombre: document.getElementById('nombre').value,
            apellido: document.getElementById('apellido').value,
            email: document.getElementById('email').value,
            password: password,
        };

        try {
            const r = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const data = await r.json();
            msg.className = 'mt-3 alert ' + (r.ok ? 'alert-success' : 'alert-danger');
            msg.textContent = r.ok ? data.message : data.error;
            if (r.ok) e.target.reset();
        } catch (err) {
            msg.className = 'mt-3 alert alert-danger';
            msg.textContent = 'No se pudo conectar con el servidor';
        }
    });
    </script>

</body>

</html>
