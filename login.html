
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Inicio de sesión COMBOX2">
    <meta name="author" content="COMBOX2">

    <title>COMBOX2 - Iniciar sesión</title>

    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-primary">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-10 col-lg-12 col-md-9">

                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="row">

                            <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>

                            <div class="col-lg-6">
                                <div class="p-5">

                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4">
                                            ¡Bienvenido de nuevo!
                                        </h1>
                                    </div>

                                    <form class="user" id="loginForm">

                                        <div class="form-group">
                                            <input
                                                type="email"
                                                class="form-control form-control-user"
                                                id="exampleInputEmail"
                                                placeholder="Correo electrónico"
                                                autocomplete="email"
                                                required>
                                        </div>

                                        <div class="form-group">
                                            <input
                                                type="password"
                                                class="form-control form-control-user"
                                                id="exampleInputPassword"
                                                placeholder="Contraseña"
                                                autocomplete="current-password"
                                                required>
                                        </div>

                                        <div class="form-group">
                                            <div class="custom-control custom-checkbox small">
                                                <input
                                                    type="checkbox"
                                                    class="custom-control-input"
                                                    id="customCheck">
                                                <label class="custom-control-label" for="customCheck">
                                                    Recordarme
                                                </label>
                                            </div>
                                        </div>

                                        <div id="loginMessage"
                                            class="small mb-3"
                                            role="status"
                                            aria-live="polite"></div>

                                        <button
                                            type="submit"
                                            class="btn btn-primary btn-user btn-block"
                                            id="loginButton">
                                            Iniciar sesión
                                        </button>

                                    </form>

                                    <hr>

                                    <div class="text-center">
                                        <a class="small" href="forgot-password.html">
                                            ¿Olvidaste tu contraseña?
                                        </a>
                                    </div>

                                    <div class="text-center">
                                        <a class="small" href="register.html">
                                            Crear una cuenta
                                        </a>
                                    </div>

                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginMessage = document.getElementById('loginMessage');
        const loginButton = document.getElementById('loginButton');

        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('exampleInputEmail').value.trim();
            const password = document.getElementById('exampleInputPassword').value;

            loginButton.disabled = true;
            loginMessage.className = 'small mb-3 text-gray-600';
            loginMessage.textContent = 'Verificando datos...';

            try {
                const response = await fetch(
                    'https://nfosjjjrkklkgogqavin.supabase.co/functions/v1/signin',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': 'sb_publishable_Id7sh5NrF1QtUufwABzqAQ_NZmmkUxG'
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || 'No se pudo iniciar sesión. Verifica tus datos.'
                    );
                }

                if (!data.session) {
                    throw new Error('La respuesta no contiene una sesión válida.');
                }

                if (document.getElementById('customCheck').checked) {
                    localStorage.setItem(
                        'supabase_session',
                        JSON.stringify(data.session)
                    );
                } else {
                    sessionStorage.setItem(
                        'supabase_session',
                        JSON.stringify(data.session)
                    );
                }

                loginMessage.className = 'small mb-3 text-success';
                loginMessage.textContent = '¡Inicio de sesión correcto!';

                window.location.href = 'index.html';

            } catch (error) {
                loginMessage.className = 'small mb-3 text-danger';
                loginMessage.textContent =
                    error.message || 'No se pudo conectar con Supabase.';
            } finally {
                loginButton.disabled = false;
            }
        });
    </script>

</body>
</html>
